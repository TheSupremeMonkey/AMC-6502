; User confirmed the connected board is 16 MHz.
[platformio]
default_envs = promicro16

[env]
platform = platformio/atmelavr@5.3.0
framework = arduino
platform_packages =
    platformio/framework-arduino-avr@5.4.0
    platformio/toolchain-atmelavr@1.70300.191015
    platformio/tool-avrdude@1.60300.200527
monitor_speed = 115200
monitor_dtr = 1

[env:promicro16]
board = sparkfun_promicro16
